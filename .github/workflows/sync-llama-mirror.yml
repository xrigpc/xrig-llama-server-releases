name: Sync llama.cpp mirror
"on":
  workflow_dispatch:
    inputs:
      llama_commit:
        description: Exact upstream 40-character SHA to mirror and approve
        required: true
        type: string
  schedule:
    - cron: '17 4 * * 1'
jobs:
  sync:
    runs-on: ubuntu-24.04
    permissions: { contents: read }
    environment: production
    steps:
      - name: Resolve selected upstream commit
        id: source
        env:
          INPUT_COMMIT: ${{ inputs.llama_commit }}
        run: |
          set -euo pipefail
          commit="$INPUT_COMMIT"
          if [ -z "$commit" ]; then commit=$(git ls-remote https://github.com/ggml-org/llama.cpp.git HEAD | awk '{print $1}'); fi
          [[ "$commit" =~ ^[a-f0-9]{40}$ ]]
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - name: Mirror clean upstream ref and tag approved XTX candidate
        env:
          MIRROR_TOKEN: ${{ secrets.XRIG_MIRROR_TOKEN }}
          COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          set -euo pipefail
          git init -q mirror.git
          git -C mirror.git fetch -q --depth=1 https://github.com/ggml-org/llama.cpp.git "$COMMIT"
          git -C mirror.git cat-file -e "$COMMIT^{commit}"
          git -C mirror.git branch -f main FETCH_HEAD
          git -C mirror.git remote add xrig "https://x-access-token:${MIRROR_TOKEN}@github.com/xrigpc/llama.cpp.git"
          git -C mirror.git push xrig refs/heads/main:refs/heads/main
          short=${COMMIT:0:12}; tag="xrig-approved/rx7900xtx-rocm-gfx1100/llama-${short}"
          existing="$(git -C mirror.git ls-remote xrig "refs/tags/${tag}^{}" | awk '{print $1}')"
          if [[ -n "$existing" ]]; then
            [[ "$existing" == "$COMMIT" ]] || { echo "existing approval tag points at a different source commit" >&2; exit 1; }
          else
            git -C mirror.git tag -a "$tag" "$COMMIT" -m "XRIG approved RX 7900 XTX (ROCm gfx1100) source $COMMIT"
            git -C mirror.git push xrig "refs/tags/$tag"
          fi
