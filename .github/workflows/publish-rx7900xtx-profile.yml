name: Publish Profile — RX 7900 XTX (ROCm gfx1100)
"on":
  workflow_dispatch:
    inputs:
      github_release_tag: { description: Completed XTX GitHub Release tag, required: true, type: string }
      profile_revision: { description: New readable Profile 2 revision, required: true, type: string }
jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: production
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - name: Download release evidence
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.github_release_tag }}
        run: mkdir evidence && gh release download "$TAG" --dir evidence --pattern 'receipt.json*' --pattern 'qualification.json*' --pattern 'runtime-closure.txt'
      - name: Create pinned immutable config revision
        env:
          TAG: ${{ inputs.github_release_tag }}
          REVISION: ${{ inputs.profile_revision }}
        run: |
          node - configs/qwen3.8-27b-rx7900xtx-rocm-profile2.json "$TAG" "$REVISION" <<'NODE'
          const fs=require('fs');const p=process.argv[2],tag=process.argv[3],revision=process.argv[4];const c=JSON.parse(fs.readFileSync(p));c.version=revision;c.runtime.ref.version=tag;fs.mkdirSync('out',{recursive:true});fs.writeFileSync('out/config.json',JSON.stringify(c,null,2)+'\n');
          NODE
      - name: Publish signed metadata in strict order
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          XRIG_ED25519_PRIVATE_KEY_B64: ${{ secrets.XRIG_ED25519_PRIVATE_KEY_B64 }}
          XRIG_ED25519_PUBLIC_KEY_B64: ${{ secrets.XRIG_ED25519_PUBLIC_KEY_B64 }}
        run: scripts/publish-supabase.sh profiles/rx7900xtx-rocm-gfx1100.yaml "${{ inputs.github_release_tag }}" "${{ inputs.profile_revision }}" evidence out/config.json
